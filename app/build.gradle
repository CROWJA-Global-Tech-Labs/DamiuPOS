plugins {
    id 'com.android.application'
}

android {
    namespace 'com.damiu.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.damiu.pos"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"

        // AdMob Application ID (test ID — ganti saat rilis)
        manifestPlaceholders = [
            admobAppId: "ca-app-pub-3940256099942544~3347511713"
        ]

        // Subscription product IDs (match Google Play Console)
        buildConfigField "String", "SUB_PRODUCT_MONTHLY", "\"damiu_pro_monthly\""
        buildConfigField "String", "SUB_PRODUCT_YEARLY",  "\"damiu_pro_yearly\""

        // Test Ad Unit IDs — ganti dengan production IDs di release
        buildConfigField "String", "ADMOB_BANNER_ID",       "\"ca-app-pub-3940256099942544/6300978111\""
        buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3940256099942544/1033173712\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.webkit:webkit:1.8.0'

    // Google AdMob
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    // Google Play Billing (subscriptions)
    implementation 'com.android.billingclient:billing:7.1.1'
}
