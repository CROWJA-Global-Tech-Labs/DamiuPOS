plugins {
    id 'com.android.application'
}

// Load release signing credentials from local.properties (NOT committed to git)
def signingProps = new Properties()
def signingPropsFile = rootProject.file('local.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'com.crowja.damiupos'
    compileSdk 34

    defaultConfig {
        applicationId "com.crowja.damiupos"
        // minSdk 26 (Android 8.0): Apache POI (enkripsi XLSX laporan shift)
        // memakai MethodHandle.invoke & java.nio.file yang baru tersedia native
        // di API 26+.
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // AdMob Application ID (test ID — ganti saat rilis)
        manifestPlaceholders = [
            admobAppId: "ca-app-pub-3940256099942544~3347511713"
        ]

        // ============================================================
        // DEV FLAG: bypass PRO check.
        // Set ke "true" supaya app berjalan dengan semua fitur Pro
        // tanpa perlu subscription. Ganti ke "false" untuk build rilis.
        // Ini SATU-SATUNYA tempat untuk toggle bypass Pro.
        // ============================================================
        buildConfigField "boolean", "BYPASS_PRO", "true"

        // Subscription product IDs (harus match Google Play Console):
        //  - damiu_pro_monthly : Rp 20.000 / bulan
        //  - damiu_pro_yearly  : Rp 200.000 / tahun (bayar 10 bulan, gratis 2 bulan)
        buildConfigField "String", "SUB_PRODUCT_MONTHLY", "\"damiu_pro_monthly\""
        buildConfigField "String", "SUB_PRODUCT_YEARLY",  "\"damiu_pro_yearly\""

        // Free tier limits — over → user kena paywall (subscribe / rewarded ad)
        buildConfigField "int", "FREE_MAX_CUSTOMERS",       "30"
        buildConfigField "int", "FREE_MAX_TRX_PER_MONTH",   "100"

        // Rewarded ad: tonton 1 ad → Pro temp 24 jam (1x/24h cooldown)
        buildConfigField "long", "REWARD_DURATION_MS",      "86400000L"  // 24h
        buildConfigField "long", "REWARD_COOLDOWN_MS",      "86400000L"  // 1x/24h

        // WhatsApp support untuk Pro subscriber
        buildConfigField "String", "PRO_SUPPORT_WA",        "\"6282xxxxxxxxx\""

        // Test Ad Unit IDs — ganti dengan production IDs di release
        buildConfigField "String", "ADMOB_BANNER_ID",       "\"ca-app-pub-3940256099942544/6300978111\""
        buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3940256099942544/1033173712\""
        buildConfigField "String", "ADMOB_REWARDED_ID",     "\"ca-app-pub-3940256099942544/5224354917\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (signingProps.getProperty('RELEASE_STORE_FILE') != null) {
                storeFile rootProject.file(signingProps.getProperty('RELEASE_STORE_FILE'))
                storePassword signingProps.getProperty('RELEASE_STORE_PASSWORD')
                keyAlias signingProps.getProperty('RELEASE_KEY_ALIAS')
                keyPassword signingProps.getProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Beberapa dependency membawa file lisensi/notice META-INF yang bentrok saat
    // merge — exclude metadata itu.
    packaging {
        resources {
            excludes += [
                    'META-INF/LICENSE.md', 'META-INF/LICENSE.txt', 'META-INF/LICENSE',
                    'META-INF/NOTICE.md', 'META-INF/NOTICE.txt', 'META-INF/NOTICE',
                    'META-INF/DEPENDENCIES', 'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.webkit:webkit:1.8.0'

    // Google AdMob
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    // Google Play Billing (subscriptions)
    implementation 'com.android.billingclient:billing:7.1.1'

    // CameraX — selfie wajah otomatis saat clock in / pulang.
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    // QR scanner — scan kode provisioning dari dashboard (Sinkronisasi Online → Scan QR).
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // zip4j — bungkus slip gaji XLSX (biasa) dalam ZIP ber-password (PIN admin).
    // Kompatibel WA + bisa diekstrak penampil umum lalu XLSX dibuka di mana saja.
    implementation 'net.lingala.zip4j:zip4j:2.11.5'

    // Online sync (Phase 2): REST client + JSON + background scheduling.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    // WorkManager's Worker references Guava's ListenableFuture; full Guava (already in
    // the runtime graph via play-services at this version) is promoted to compile so the
    // class is visible — same artifact, so no dex duplicate / size change.
    implementation 'com.google.guava:guava:31.1-android'

    // (No MQTT.) The online layer is 100% REST polling: a ~15-min WorkManager job
    // + an on-resume sync run a tick that pulls data, live config (/me, heartbeat),
    // app version, broadcasts, and queued device-management commands.

    // Fused location (Phase 5): battery-efficient GPS for live staff tracking.
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Instrumented (on-device) tests — used to verify the sync client end-to-end.
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
